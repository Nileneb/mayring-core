name: mayring-watch
on:
  push:
    branches: ["**"]
  workflow_run:
    workflows:
      - "tests"
    types: [completed]
permissions:
  contents: read
  # repo-watch.yml authenticates to MayringCoder via GitHub OIDC (secretless) and
  # requests id-token: write. A caller cannot grant a reusable workflow more than
  # it holds itself, so without id-token here the called job is denied at startup
  # (every run was startup_failure). Mirror the reusable workflow's requirement.
  id-token: write
jobs:
  watch:
    uses: Nileneb/mayring-claude-plugin/.github/workflows/repo-watch.yml@main
    secrets:
      # Reuse the repo's MCP service token as the reusable workflow's MAYRING_TOKEN.
      MAYRING_TOKEN: ${{ secrets.MCP_SERVICE_TOKEN }}

[pytest]
# Narrowly silence a THIRD-PARTY protobuf deprecation (google._upb._message uses
# PyType_Spec with a custom-tp_new metaclass) pulled in transitively via chromadb/grpc.
# It is not our code and not fixable here; this filter targets ONLY that message so real
# (our-code) DeprecationWarnings still surface. Do NOT broaden to a blanket ignore.
filterwarnings =
    ignore:.*PyType_Spec with a metaclass that has custom tp_new.*:DeprecationWarning
